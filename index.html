<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquetado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="todas-pantallas">

        <section class="primera-pantalla">
            <section class="espacio-buscador">
                <div class="buscador">
                    <div class="barra-busqueda"></div>
                </div>
                <div class="buscar"></div>
            </section>
            <section class="cuatro-opciones">
                <article class="opcion"></article>
                <article class="opcion"></article>
                <article class="opcion"></article>
                <article class="opcion"></article>
            </section>
        </section>

        <section class="segunda-pantalla">

        <div class="espaciocuadrado-info">
            <div class="cuadrado-info">
                <div class="lista">
                    <div class="punto"></div>
                    <div class="texto-cuadrado"> </div>
                </div>

                <div class="lista">
                    <div class="punto"></div>
                    <div class="texto-cuadrado"> </div>
                </div>                    
            </div>
          
            
        </div>    

        <article class="espacioinfo">
            <header class="titulo"></header>
            <article class="texto-info"></article>
            <article class="texto-info"></article>
            <article class="texto-info-chico"></article>
        </article>

        </section>

        <section class="tercera-pantalla">
            <section class="grid">
                <div class="pantalla-tres-partes">
                    <div class="pantalla-tres-cuadrado-1">
                        <header class="titulo-cuadrado-p-tres"></header>
                        <article class="texto-cuadrado-p-tres"></article>
                        <article class="texto-cuadrado-p-tres"></article>
                        <article class="texto-cuadrado-p-tres-corto"></article>
                    </div>
                    <div class="pantalla-tres-texto-abajo">
                        <header class="titulo-p-tres"></header>
                        <article class="texto-p-tres"></article>
                        <article class="texto-p-tres"></article>
                        <article class="texto-p-tres-corto"></article>
                    </div>
                </div>

                <div class="pantalla-tres-partes">
                    <div class="pantalla-tres-cuadrado-2">
                        <header class="titulo-cuadrado-p-tres"></header>
                        <article class="texto-cuadrado-p-tres"></article>
                        <article class="texto-cuadrado-p-tres"></article>
                        <article class="texto-cuadrado-p-tres-corto"></article>
                    </div>
                    <div class="pantalla-tres-texto-abajo">
                        <header class="titulo-p-tres"></header>
                        <article class="texto-p-tres"></article>
                        <article class="texto-p-tres"></article>
                        <article class="texto-p-tres-corto"></article>
                    </div>
                </div>



                <div class="pantalla-tres-partes">
                    <div class="pantalla-tres-cuadrado-3">
                    <header class="titulo-cuadrado-p-tres"></header>
                    <article class="texto-cuadrado-p-tres"></article>
                    <article class="texto-cuadrado-p-tres"></article>
                    <article class="texto-cuadrado-p-tres-corto"></article>
                </div>
                <div class="pantalla-tres-texto-abajo">
                    <header class="titulo-p-tres"></header>
                    <article class="texto-p-tres"></article>
                    <article class="texto-p-tres"></article>
                    <article class="texto-p-tres-corto"></article>
                </div>
                </div>

                

            </section>
        </section>

    </section>
    
   
</body>
</html>
